<!DOCTYPE html>
<html>
<head>
    <title>Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header><div class="logo">Careergate</div></header>

<section class="hero">
<h1>Job Application Tracker</h1>
</section>

<section style="padding:40px;">

<h2>Add Job</h2>

<form>
<input type="text" placeholder="Job Title" required><br><br>
<input type="text" placeholder="Company" required><br><br>
<input type="text" placeholder="Location"><br><br>
<input type="date"><br><br>

<select>
<option>Pending</option>
<option>Interview</option>
<option>Accepted</option>
<option>Rejected</option>
</select><br><br>

<textarea placeholder="Notes"></textarea><br><br>

<button class="btn">Add Job</button>
</form>

<h2 style="margin-top:40px;">Applications</h2>

<table border="1" width="100%" cellpadding="10">
<tr>
<th>Title</th>
<th>Company</th>
<th>Date</th>
<th>Status</th>
</tr>
<tr>
<td>Frontend Developer</td>
<td>Tech Co</td>
<td>2026-02-01</td>
<td>Pending</td>
</tr>
</table>

</section>

<footer><p>© 2026 Careergate</p></footer>

</body>
</html
